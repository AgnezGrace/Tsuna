<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tsuna - Ruang Penulisan</title>
  <link rel="stylesheet" href="css/style.css">
  <link id="themeStylesheet" rel="stylesheet" href="css/themes/theme-sage.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside id="sidebarMenu" class="sidebar-drawer hidden">
    <div class="sidebar-header">
      <div class="brand">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span>Pengaturan</span>
      </div>
      <button id="btnCloseSidebar" class="btn-icon" aria-label="Tutup Pengaturan">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="sidebar-content">
      <h3>Pilih Palet Tema</h3>
      <div class="theme-selector-list">
        <div class="theme-card" data-theme="theme-sage">
          <div class="swatch-container">
            <span style="background: #E3EED4;"></span>
            <span style="background: #AEC3B0;"></span>
            <span style="background: #6B9071;"></span>
            <span style="background: #375534;"></span>
            <span style="background: #0F2A1D;"></span>
          </div>
          <div class="theme-label">Sage Forest</div>
        </div>

        <div class="theme-card" data-theme="theme-lavender">
          <div class="swatch-container">
            <span style="background: #DCD7D5;"></span>
            <span style="background: #BA96C1;"></span>
            <span style="background: #9C8CB9;"></span>
            <span style="background: #6C5F8D;"></span>
            <span style="background: #4B3F6E;"></span>
          </div>
          <div class="theme-label">Skijan Lavender</div>
        </div>

        <div class="theme-card" data-theme="theme-monochrome">
          <div class="swatch-container">
            <span style="background: #F5F5F5;"></span>
            <span style="background: #E0E0E0;"></span>
            <span style="background: #888888;"></span>
            <span style="background: #4A4A4A;"></span>
            <span style="background: #1A1A1A;"></span>
          </div>
          <div class="theme-label">Charcoal & Monochrome</div>
        </div>

        <div class="theme-card" data-theme="theme-warm">
          <div class="swatch-container">
            <span style="background: #E1D4C2;"></span>
            <span style="background: #BEB5A9;"></span>
            <span style="background: #A78D78;"></span>
            <span style="background: #6E473B;"></span>
            <span style="background: #291C0E;"></span>
          </div>
          <div class="theme-label">Uxintace Earthy</div>
        </div>

        <div class="theme-card" data-theme="theme-berry">
          <div class="swatch-container">
            <span style="background: #FFBB94;"></span>
            <span style="background: #FB9590;"></span>
            <span style="background: #DC586D;"></span>
            <span style="background: #A33757;"></span>
            <span style="background: #4C1D3D;"></span>
          </div>
          <div class="theme-label">Berry Sunset</div>
        </div>

        <div class="theme-card" data-theme="theme-ocean">
          <div class="swatch-container">
            <span style="background: #C1E8FF;"></span>
            <span style="background: #7DA0CA;"></span>
            <span style="background: #5483B3;"></span>
            <span style="background: #052659;"></span>
            <span style="background: #021024;"></span>
          </div>
          <div class="theme-label">Ocean Navy</div>
        </div>
      </div>
    </div>
  </aside>

  <section id="viewHome" class="app-view">
    <header class="navbar">
      <button id="btnBrandMenu" class="brand-btn" aria-label="Buka Menu Pengaturan">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 3C16 3.5 11 7 9 12C7.5 15.8 7 20 7 20C7 20 10.5 18.5 13 16C16.5 12.5 18.5 8 22 3Z"/>
          <path d="M12.5 7.5C9.5 9 7 11.5 5 15C3.5 17.6 2 21 2 21C2 21 5 19.5 7 18"/>
          <path d="M16 4.5C13 6 10.5 8.5 8.5 11.5"/>
        </svg>
        <span class="brand-title">Tsuna</span>
      </button>

      <div class="nav-actions">
        <button id="btnOpenDB" class="btn-icon" aria-label="Kelola Database">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button id="btnOpenCreateModal" class="btn-icon" aria-label="Buat Karya Baru">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <main class="container">
      <div id="emptyState" class="empty-state">
        <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <p>Belum ada karya. Klik tombol + di atas untuk membuat karya pertama.</p>
      </div>
      <div id="storyGrid" class="story-grid hidden"></div>
    </main>
  </section>

  <div id="modalCreateOverlay" class="modal-overlay hidden">
    <div class="modal-box modal-large">
      <div class="modal-header">
        <h2>Buat Karya Baru</h2>
        <button id="btnCloseCreateModal" class="btn-icon" aria-label="Tutup Modal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="formCreateStory" class="modal-body">
        
        <div class="form-group">
          <label for="storyTitleInput">Judul Karya</label>
          <input type="text" id="storyTitleInput" placeholder="Masukkan judul karya..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="storyAuthorInput">Nama Penulis / Subjudul</label>
          <input type="text" id="storyAuthorInput" placeholder="Masukkan nama penulis..." autocomplete="off">
        </div>

        <div class="form-group">
          <label>Jenis Sampul</label>
          <div class="tab-buttons">
            <button type="button" id="tabPresetMode" class="btn-tab active">Layout Preset</button>
            <button type="button" id="tabGalleryMode" class="btn-tab">Dari Galeri</button>
          </div>
        </div>

        <div id="sectionPresetControls" class="form-group">
          <label>Layout Sampul</label>
          <div class="layout-selector">
            <button type="button" class="btn-layout active" data-layout="layout-bottom">Bawah</button>
            <button type="button" class="btn-layout" data-layout="layout-center">Tengah</button>
            <button type="button" class="btn-layout" data-layout="layout-minimal">Minimal</button>
          </div>

          <label style="margin-top: 0.8rem;">Warna Background</label>
          <div class="preset-grid">
            <div class="preset-option preset-bg-1 active" data-preset="preset-bg-1"></div>
            <div class="preset-option preset-bg-2" data-preset="preset-bg-2"></div>
            <div class="preset-option preset-bg-3" data-preset="preset-bg-3"></div>
            <div class="preset-option preset-bg-4" data-preset="preset-bg-4"></div>
            <div class="preset-option preset-bg-5" data-preset="preset-bg-5"></div>
            <div class="preset-option preset-bg-6" data-preset="preset-bg-6"></div>
          </div>
        </div>

        <div id="sectionGalleryControls" class="form-group hidden">
          <label>Unggah Gambar dari Galeri</label>
          <label class="file-upload-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span id="galleryFileName">Pilih foto dari HP / Perangkat</span>
            <input type="file" id="inputGalleryImage" accept="image/*" style="display: none;">
          </label>
        </div>

        <div class="form-group">
          <label>Pratinjau Sampul</label>
          <div class="preview-center">
            <div id="cardPreview" class="card-portrait preset-bg-1 layout-bottom">
              <div class="cover-overlay"></div>
              <div class="card-top">
                <span class="badge">Draft</span>
              </div>
              <div class="card-bottom">
                <h3 id="previewTitleText">Judul Karya</h3>
                <p id="previewAuthorText">Nama Penulis</p>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">Simpan Karya</button>
      </form>
    </div>
  </div>

  <div id="modalDBOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Kelola Database</h2>
        <button id="btnCloseDBModal" class="btn-icon" aria-label="Tutup Modal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <button id="btnExportJSON" class="btn-primary">Cadangkan (Export JSON)</button>
        <label class="btn-secondary" style="cursor: pointer;">
          Pulihkan (Import JSON)
          <input type="file" id="inputImportJSON" accept=".json" style="display: none;">
        </label>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/secret.js"></script>
</body>
</html>
