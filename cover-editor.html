<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengatur Sampul - Tsuna</title>
  <link rel="stylesheet" href="css/style.css">
  <link id="themeStylesheet" rel="stylesheet" href="css/themes/theme-sage.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <a id="btnBackToEditor" href="index.html" class="btn-icon" aria-label="Kembali">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <span class="brand">Desain Sampul</span>
    <button id="btnSaveCover" class="btn-primary-sm">Simpan</button>
  </header>

  <main class="container cover-editor-container">
    
    <div class="cover-preview-wrapper">
      <div id="coverPreview" class="cover-preview-card preset-bg-1 layout-bottom">
        <div class="cover-overlay"></div>
        <div class="card-top">
          <span id="previewBadge" class="badge">Draft</span>
        </div>
        <div class="card-bottom">
          <h2 id="previewTitle">Judul Karya</h2>
          <p id="previewAuthor">Nama Penulis</p>
        </div>
      </div>
    </div>

    <div class="cover-controls">
      
      <div class="control-group">
        <label for="inputCoverTitle">Teks Sampul</label>
        <input type="text" id="inputCoverTitle" placeholder="Judul Karya..." value="Judul Karya">
        <input type="text" id="inputCoverAuthor" placeholder="Nama Penulis / Subjudul..." value="Nama Penulis" style="margin-top: 0.5rem;">
      </div>

      <div class="control-group">
        <label>Sumber Gambar</label>
        <div class="tab-buttons">
          <button id="tabPreset" class="btn-tab active">Preset Bawaan</button>
          <button id="tabGallery" class="btn-tab">Dari Galeri</button>
        </div>
      </div>

      <div id="sectionPresets" class="control-section">
        <label>Layout Teks</label>
        <div class="layout-selector" style="margin-bottom: 0.8rem;">
          <button type="button" class="btn-layout active" data-layout="layout-bottom">Bawah</button>
          <button type="button" class="btn-layout" data-layout="layout-center">Tengah</button>
          <button type="button" class="btn-layout" data-layout="layout-minimal">Minimal</button>
        </div>

        <label>Pilih Warna Preset</label>
        <div class="preset-grid">
          <div class="preset-option preset-bg-1 active" data-preset="preset-bg-1"></div>
          <div class="preset-option preset-bg-2" data-preset="preset-bg-2"></div>
          <div class="preset-option preset-bg-3" data-preset="preset-bg-3"></div>
          <div class="preset-option preset-bg-4" data-preset="preset-bg-4"></div>
          <div class="preset-option preset-bg-5" data-preset="preset-bg-5"></div>
          <div class="preset-option preset-bg-6" data-preset="preset-bg-6"></div>
        </div>
      </div>

      <div id="sectionGallery" class="control-section hidden">
        <label>Unggah Foto Perangkat</label>
        <label class="file-upload-box">
          <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <span id="galleryText">Klik untuk memilih gambar dari Galeri</span>
          <input type="file" id="inputGalleryFile" accept="image/*" style="display: none;">
        </label>
      </div>

    </div>

  </main>

  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cover.js"></script>
</body>
</html>
