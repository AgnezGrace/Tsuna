<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Karya - Tsuna</title>
  <link rel="stylesheet" href="css/style.css">
  <link id="themeStylesheet" rel="stylesheet" href="css/themes/theme-sage.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="btn-icon" aria-label="Kembali">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <span class="brand">Detail Karya</span>
    <div class="nav-actions">
      <a id="btnEditCover" href="#" class="btn-icon" aria-label="Desain Sampul">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </a>
      <button id="btnDeleteStory" class="btn-icon danger-icon" aria-label="Hapus Karya">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="chapter-section-header">
      <h3>Daftar Bab</h3>
      <button id="btnOpenCreateChapter" class="btn-primary-sm">+ Bab Baru</button>
    </div>

    <div id="chapterEmptyState" class="empty-state" style="padding: 2rem 0;">
      <p>Belum ada bab. Klik "+ Bab Baru" untuk mulai menulis.</p>
    </div>

    <div id="chapterList" class="chapter-list hidden"></div>
  </main>

  <div id="modalChapterOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Tambah Bab Baru</h2>
        <button id="btnCloseChapterModal" class="btn-icon" aria-label="Tutup Modal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="formCreateChapter" class="modal-body">
        <div class="form-group">
          <label for="chapterTitleInput">Judul Bab</label>
          <input type="text" id="chapterTitleInput" placeholder="Contoh: Bab 1 - Awal Mula" required autocomplete="off">
        </div>
        <button type="submit" class="btn-primary">Mulai Menulis</button>
      </form>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/story-detail.js"></script>
</body>
</html>
